<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>裸辞模拟器 · 替你活一遍辞职后的那一年</title>
<meta name="description" content="用 10 分钟，替你活一遍裸辞之后的那一年。测测你的裸辞人格。">
<style>
:root {
  --bg: #fdf8f1;
  --bg-soft: #f7ede0;
  --card: #ffffff;
  --ink: #33281f;
  --ink-soft: #6b5b4d;
  --muted: #a2937f;
  --line: #efe3d3;
  --accent: #f2762e;
  --accent-deep: #d95f1f;
  --accent-soft: #ffe9d6;
  --pink: #ffd9de;
  --green: #5aa96a;
  --red: #dd5b4b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background:
    radial-gradient(1200px 500px at 50% -10%, #ffe9d2 0%, rgba(255,233,210,0) 60%),
    var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.65;
  min-height: 100%;
}

#app { max-width: 520px; margin: 0 auto; padding: 22px 18px 56px; }

.screen { display: none; animation: fadein .4s ease; }
.screen.active { display: block; }
@keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.hidden { display: none !important; }

b { color: var(--accent-deep); font-weight: 700; }

/* ---------- 通用按钮 ---------- */
.btn {
  display: inline-block; width: 100%;
  padding: 15px 18px; border-radius: 18px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  border: none; font-family: inherit;
  transition: transform .1s ease, box-shadow .1s ease;
  letter-spacing: .5px;
}
.btn:active { transform: translateY(3px); }
.btn.primary {
  background: linear-gradient(180deg, #ff9448, var(--accent));
  color: #fff; box-shadow: 0 5px 0 var(--accent-deep);
}
.btn.primary:active { box-shadow: 0 2px 0 var(--accent-deep); }
.btn.soft {
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line);
  box-shadow: 0 4px 0 #ecdfcd;
}
.btn.soft:active { box-shadow: 0 1px 0 #ecdfcd; }
.btn.ghost { background: transparent; border: 1.5px dashed var(--line); color: var(--ink-soft); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn + .btn { margin-top: 12px; }

.link-btn {
  background: none; border: none; color: var(--accent-deep);
  font-size: 13px; cursor: pointer; text-decoration: underline;
  padding: 4px 0; font-family: inherit; font-weight: 600;
}

/* ---------- 开局设定 ---------- */
.setup-hero { text-align: center; padding: 18px 0 22px; }
.hero-pill {
  display: inline-block; font-size: 12px; font-weight: 700;
  letter-spacing: 2px; color: var(--accent-deep);
  background: var(--accent-soft); border-radius: 999px;
  padding: 5px 16px; margin-bottom: 16px;
}
.setup-hero h1 {
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  font-size: 40px; font-weight: 800; letter-spacing: 3px;
  line-height: 1.25;
}
.tagline {
  margin-top: 12px; color: var(--ink-soft); font-size: 14px; line-height: 1.8;
}

.form-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 8px 20px;
  box-shadow: 0 10px 30px rgba(210, 170, 120, 0.12);
}

.field { padding: 16px 0; border-bottom: 1px dashed var(--line); }
.field:last-child { border-bottom: none; }
.field label {
  display: block; font-size: 15px; font-weight: 700;
  color: var(--ink); margin-bottom: 10px; letter-spacing: 1px;
}

.num-row { display: flex; align-items: center; gap: 10px; }
.num-row input[type=number] {
  flex: 1; min-width: 0;
  font-size: 24px; font-weight: 800; color: var(--ink);
  background: var(--bg-soft); border: 1.5px solid transparent;
  border-radius: 14px; padding: 10px 14px; text-align: center;
  font-family: inherit; outline: none;
  -moz-appearance: textfield; appearance: textfield;
}
.num-row input[type=number]::-webkit-outer-spin-button,
.num-row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num-row input[type=number]:focus { border-color: var(--accent); background: #fff; }
.unit { color: var(--muted); font-size: 14px; width: 20px; }
.step-btn {
  width: 44px; height: 44px; border-radius: 14px; flex: 0 0 44px;
  background: var(--card); border: 1.5px solid var(--line);
  color: var(--ink); font-size: 22px; font-weight: 700; cursor: pointer;
  line-height: 1; font-family: inherit;
}
.step-btn:active { background: var(--accent-soft); transform: scale(.96); }

.field-hint { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: right; }

.seg { display: flex; gap: 8px; }
.seg-btn {
  flex: 1; padding: 11px 0; border-radius: 14px;
  background: var(--bg-soft); border: 1.5px solid transparent;
  color: var(--ink-soft); font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  transition: all .15s ease;
}
.seg-btn.selected {
  background: var(--ink); color: #fff; font-weight: 700;
  box-shadow: 0 3px 0 #1e1712;
}

.preview {
  margin: 16px 0 0; padding: 16px 18px;
  background: linear-gradient(135deg, #fff1e2, #ffe4e4);
  border-radius: 18px; color: var(--ink-soft); font-size: 14px;
  line-height: 1.9;
}

.setup-actions { margin-top: 18px; display: flex; gap: 10px; }
.setup-actions .btn { flex: 1; }
.setup-actions .btn + .btn { margin-top: 0; }
.setup-footnote { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }

.share-banner {
  margin-bottom: 14px; padding: 12px 16px;
  background: var(--pink); border-radius: 14px;
  font-size: 13px; color: var(--ink-soft);
}
.share-banner span { display: block; margin-bottom: 4px; }

/* ---------- 月度推演 ---------- */
.game-header { padding: 4px 0 16px; }
.month-row { display: flex; justify-content: space-between; align-items: baseline; }
.month-label { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
.cash-tag { font-size: 22px; font-weight: 800; color: var(--ink); }
.cash-tag.danger { color: var(--red); }

.progress-dots { display: flex; gap: 5px; margin-top: 10px; }
.pdot { flex: 1; height: 5px; border-radius: 3px; background: #eddcc8; }
.pdot.done { background: var(--accent); }

.status-panels {
  display: flex; gap: 12px; margin-bottom: 20px;
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 18px; padding: 14px 16px;
}
.stat { flex: 1; }
.stat-label {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600;
}
.stat-label output { color: var(--ink); font-weight: 800; font-size: 15px; }
.bar { height: 8px; border-radius: 4px; background: var(--bg-soft); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .45s ease; }
.bar-fill.mentality { background: linear-gradient(90deg, #ff9d78, var(--accent)); }
.bar-fill.mentality.warn { background: #e9a53c; }
.bar-fill.mentality.danger { background: var(--red); }
.bar-fill.comp { background: linear-gradient(90deg, #8cc7a1, var(--green)); }

.event-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 22px; padding: 24px 22px; margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(210, 170, 120, 0.1);
}
.event-cat {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 3px 12px; border-radius: 999px; margin-bottom: 12px;
  background: var(--bg-soft); color: var(--ink-soft);
}
.event-cat.cat-job { background: #e3edff; color: #3f63a8; }
.event-cat.cat-gig { background: #e6f5e4; color: #3f7d46; }
.event-cat.cat-boom { background: #ffedd9; color: #b5661b; }
.event-cat.cat-family { background: #ffe6ea; color: #ab4a5d; }
.event-cat.cat-accident { background: #f1e8ff; color: #6b4fa4; }
.event-cat.cat-social { background: #e2f4f6; color: #35727c; }
.event-card h3 { font-size: 21px; font-weight: 800; margin-bottom: 10px; line-height: 1.4; }
.event-card p { font-size: 15px; color: var(--ink-soft); }

.choice { margin-bottom: 12px; }
.choice .btn { text-align: left; padding: 16px 18px; border-radius: 16px; }
.choice-note { font-size: 12px; color: var(--muted); margin-top: 6px; padding-left: 6px; }
.plan-head {
  font-size: 14px; color: var(--ink-soft); text-align: center;
  margin: 6px 0 14px; font-weight: 700; letter-spacing: 1px;
}

/* ---------- 月度报告 ---------- */
.report-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 22px; padding: 24px 22px; margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(210, 170, 120, 0.1);
}
.report-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
.report-line {
  font-size: 14px; color: var(--ink-soft);
  padding: 7px 0 7px 16px; position: relative;
  border-bottom: 1px dashed var(--line);
}
.report-line:last-child { border-bottom: none; }
.report-line::before {
  content: ""; position: absolute; left: 2px; top: 14px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
}
.report-status {
  margin-top: 14px; padding: 12px 14px; border-radius: 14px;
  background: var(--bg-soft);
  font-size: 13px; color: var(--ink-soft);
}
.offer-box {
  margin-top: 14px; padding: 14px 16px; border-radius: 14px;
  background: #e6f5e4; border: 1.5px solid #bfe3bd;
  color: #2f6b37; font-weight: 800; font-size: 15px;
}
.offer-actions { display: flex; gap: 10px; margin-top: 12px; }
.offer-actions .btn { width: auto; flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 11px 24px; border-radius: 999px;
  font-size: 14px; font-weight: 600; z-index: 99;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
  animation: fadein .25s ease; max-width: 86vw; text-align: center;
}

/* ---------- 结局 ---------- */
.end-hero {
  text-align: center; padding: 30px 22px 26px; margin-bottom: 16px;
  background: linear-gradient(160deg, #ffedd9, #ffe3e6 60%, #fff3e6);
  border-radius: 26px; border: 1.5px solid #ffe0cd;
}
.end-line {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 3px;
  color: var(--accent-deep); background: rgba(255,255,255,.7);
  padding: 4px 16px; border-radius: 999px; margin-bottom: 14px;
}
.end-hero h2 {
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 26px; font-weight: 800; line-height: 1.45;
}
.end-hero p { margin-top: 14px; font-size: 14px; color: var(--ink-soft); text-align: left; }

.montage { margin: 0 0 16px; }
.montage-line {
  font-size: 13px; color: var(--muted);
  padding: 5px 0 5px 16px; position: relative;
}
.montage-line::before {
  content: ""; position: absolute; left: 2px; top: 13px;
  width: 5px; height: 5px; border-radius: 50%; background: #d9c6b0;
}

.personality-box {
  background: var(--card);
  border: 2px solid var(--accent);
  border-radius: 24px; padding: 26px 22px; text-align: center; margin-bottom: 16px;
  box-shadow: 0 10px 30px rgba(242, 118, 46, 0.15);
  position: relative; overflow: hidden;
}
.personality-box::before {
  content: ""; position: absolute; top: -60px; right: -60px;
  width: 160px; height: 160px; border-radius: 50%;
  background: var(--accent-soft); opacity: .7;
}
.p-label { font-size: 12px; font-weight: 800; letter-spacing: 4px; color: var(--accent-deep); margin-bottom: 10px; }
.p-name {
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 32px; font-weight: 800; line-height: 1.35;
}
.p-roast { margin-top: 12px; font-size: 14px; color: var(--ink-soft); }
.p-rarity { margin-top: 12px; font-size: 12px; color: var(--muted); }

.end-stats {
  text-align: center; font-size: 14px; color: var(--ink-soft);
  margin-bottom: 10px; line-height: 2.1;
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 18px; padding: 14px 12px;
}
.end-quote {
  text-align: center; font-size: 15px; color: var(--ink);
  padding: 18px 8px; margin-bottom: 10px; font-weight: 600;
}
.end-quote::before { content: "“ "; color: var(--accent); }

.end-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.end-actions .btn { flex: 1 1 46%; }
.end-actions .btn + .btn { margin-top: 0; }

.card-area { margin-top: 22px; text-align: center; }
#card-canvas { width: 100%; max-width: 340px; height: auto; border-radius: 16px; box-shadow: 0 8px 28px rgba(150,110,70,.18); }
.card-area .btn { max-width: 340px; margin-top: 14px; }
.card-tip { font-size: 12px; color: var(--muted); margin-top: 8px; }

.paywall {
  margin-top: 30px; padding: 20px 18px; text-align: center;
  border: 1.5px dashed #e8d5bd; border-radius: 20px;
  background: rgba(255,255,255,.6);
}
.paywall-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.paywall p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

@media (min-width: 640px) {
  .setup-hero { padding-top: 34px; }
  .setup-hero h1 { font-size: 46px; }
}

</style>
</head>
<body>
<div id="app">

  <!-- 开局设定 -->
  <section id="screen-setup" class="screen active">
    <div id="share-banner" class="share-banner hidden">
      <span id="share-banner-text"></span>
      <button id="btn-reroll-inherit" class="link-btn">掷个随机人设挑战</button>
    </div>

    <header class="setup-hero">
      <div class="hero-pill">人生模拟器 · 第一期</div>
      <h1>裸辞之后的一年</h1>
      <p class="tagline">同样的辞职，不同的活法。<br>先把你的人设摆上桌。</p>
    </header>

    <div class="setup-form">
      <div class="form-card">
        <div class="field">
          <label>年龄</label>
          <div class="num-row">
            <button class="step-btn" data-step="in-age" data-dir="-1">−</button>
            <input type="number" id="in-age" min="22" max="40" value="28" inputmode="numeric">
            <span class="unit">岁</span>
            <button class="step-btn" data-step="in-age" data-dir="1">+</button>
          </div>
        </div>

        <div class="field">
          <label>裸辞前月薪</label>
          <div class="num-row">
            <button class="step-btn" data-step="in-salary" data-dir="-1">−</button>
            <input type="number" id="in-salary" min="3000" max="80000" step="1000" value="15000" inputmode="numeric">
            <span class="unit">元</span>
            <button class="step-btn" data-step="in-salary" data-dir="1">+</button>
          </div>
        </div>

        <div class="field">
          <label>存款</label>
          <div class="num-row">
            <button class="step-btn" data-step="in-savings" data-dir="-1">−</button>
            <input type="number" id="in-savings" min="1000" max="500000" step="5000" value="80000" inputmode="numeric">
            <span class="unit">元</span>
            <button class="step-btn" data-step="in-savings" data-dir="1">+</button>
          </div>
          <div class="field-hint" id="savings-hint"></div>
        </div>

        <div class="field">
          <label>性别</label>
          <div class="seg" id="seg-gender">
            <button class="seg-btn selected" data-value="female">女生</button>
            <button class="seg-btn" data-value="male">男生</button>
            <button class="seg-btn" data-value="secret">不透露</button>
          </div>
        </div>

        <div class="field">
          <label>住房</label>
          <div class="seg" id="seg-housing">
            <button class="seg-btn" data-value="none">住家里</button>
            <button class="seg-btn selected" data-value="rent">租房</button>
            <button class="seg-btn" data-value="mortgage">还房贷</button>
          </div>
        </div>

        <div class="field">
          <label>家庭</label>
          <div class="seg" id="seg-family">
            <button class="seg-btn selected" data-value="single">单身</button>
            <button class="seg-btn" data-value="partner">有伴侣</button>
            <button class="seg-btn" data-value="kid">有娃</button>
          </div>
        </div>

        <div class="field">
          <label>城市</label>
          <div class="seg" id="seg-city">
            <button class="seg-btn selected" data-value="tier1">一线</button>
            <button class="seg-btn" data-value="newtier">新一线</button>
            <button class="seg-btn" data-value="hometown">老家</button>
          </div>
        </div>
      </div>

      <div class="preview" id="burn-preview"></div>

      <div class="setup-actions">
        <button id="btn-random" class="btn soft">手气不错 🎲</button>
        <button id="btn-start" class="btn primary">开始这一年 →</button>
      </div>
      <p class="setup-footnote">12 个月，10 分钟，一个结局，一张人格卡。</p>
    </div>
  </section>

  <!-- 月度推演 -->
  <section id="screen-game" class="screen">
    <header class="game-header">
      <div class="month-row">
        <div class="month-label" id="month-tag"></div>
        <div class="cash-tag" id="cash-tag"></div>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
    </header>

    <div class="status-panels">
      <div class="stat">
        <div class="stat-label"><span>心态</span><output id="out-mentality"></output></div>
        <div class="bar"><div id="bar-mentality" class="bar-fill mentality"></div></div>
      </div>
      <div class="stat">
        <div class="stat-label"><span>职业竞争力</span><output id="out-comp"></output></div>
        <div class="bar"><div id="bar-comp" class="bar-fill comp"></div></div>
      </div>
    </div>

    <div class="event-card">
      <div class="event-cat" id="event-cat"></div>
      <h3 id="event-title"></h3>
      <p id="event-text"></p>
    </div>

    <div id="choice-area"></div>
  </section>

  <!-- 月度报告 -->
  <section id="screen-report" class="screen">
    <header class="game-header">
      <div class="month-row">
        <div class="month-label" id="report-month-tag"></div>
      </div>
      <div class="progress-dots" id="report-progress-dots"></div>
    </header>
    <div class="report-card">
      <h3 id="report-title"></h3>
      <div id="report-lines" class="report-lines"></div>
      <div class="report-status" id="report-status"></div>
    </div>
    <button id="btn-next-month" class="btn primary wide">下个月 →</button>
  </section>

  <!-- 结局 -->
  <section id="screen-end" class="screen">
    <header class="end-hero" id="end-hero">
      <div class="end-line" id="end-line"></div>
      <h2 id="end-title"></h2>
      <p id="end-text"></p>
    </header>

    <div id="montage" class="montage"></div>

    <div class="personality-box" id="personality-box">
      <div class="p-label">你 的 裸 辞 人 格</div>
      <div class="p-name" id="p-name"></div>
      <p class="p-roast" id="p-roast"></p>
      <div class="p-rarity" id="p-rarity"></div>
    </div>

    <div class="end-stats" id="end-stats"></div>
    <div class="end-quote" id="end-quote"></div>

    <div class="end-actions">
      <button id="btn-card" class="btn primary">生成我的结局卡</button>
      <button id="btn-replay" class="btn soft">再来一局</button>
      <button id="btn-share-link" class="btn soft">用我的人设拉朋友进来</button>
    </div>

    <div id="card-area" class="card-area hidden">
      <canvas id="card-canvas" width="1080" height="1440"></canvas>
      <a id="card-download" class="btn primary wide" download="luoci-ending-card.png">保存图片 · 发小红书</a>
      <p class="card-tip">长按或右键也能保存</p>
    </div>

    <div class="paywall">
      <div class="paywall-title">🔒 十年推演 · 三线对比</div>
      <p>如果当初没辞 / 如果第 3 个月就找工作 / 如果那年去了另一个城市——三条时间线的结局对比</p>
      <button class="btn soft" disabled>¥9.9 解锁（开发中，先替你省钱）</button>
    </div>
  </section>

</div>
<!--BUILD_SCRIPTS-->
<script>
(function (global) {
  'use strict';

  var CONFIG = {
    MONTHS: 12,

    city: {
      tier1:   { name: '一线城市', rent: 5000, living: 4200 },
      newtier: { name: '新一线',   rent: 3200, living: 3200 },
      hometown:{ name: '老家',     rent: 1500, living: 2200 }
    },

    familyCoef: { single: 1.0, partner: 1.25, kid: 1.7 },
    mortgageRate: 0.45,

    mentality: {
      start: 82,
      novelty: 4,
      noveltyMonths: 2,
      restBonus: 4,
      restFadeFrom: 4,
      rejection: -6,
      anxietyLine: 3,
      anxietyHit: -6,
      emoThreshold: 20
    },

    comp: {
      start: 100,
      decay: -3,
      gigDecay: -1,
      learnGain: 4,
      boomGain: 8

    resolveBet(s, lines);

    if ((s.cash <= 0 || s.mentality <= 0) && !s.pendingOffer) {
      endGame(s, 'crash');
    } else if (s.month >= s.MONTHS) {
      endGame(s, 'fog');
    }

    return {
      month: s.month,
      plan: planId,
      lines: lines,
      burn: burn,
      income: income,
      offer: s.pendingOffer,
      ended: s.ended
    };
  }

  function resolveBet(s, lines) {
    if (!s.pendingBet) return;
    if (s.month - s.pendingBet.startedMonth < 2) return;
    var bet = s.pendingBet;
    s.pendingBet = null;
    if (bet.kind === 'startup') {
      if (E._rng() < 0.3) {
        var gain = bet.stake * 3;
        s.cash += gain;
        s.comp = I.clamp(s.comp + CFG.comp.boomGain, 0, 100);
        s.mentality = I.clamp(s.mentality + 10, 0, 100);
        s.flags.startupWin = true;
        lines.push('创业项目融资到账：押注 ' + bet.stake + ' 变成了 ' + gain + '，竞争力 +8，心态 +10');
      } else {
        var back = Math.round(bet.stake * 0.3 / 100) * 100;
        s.cash += back;
        s.mentality = I.clamp(s.mentality - 8, 0, 100);
        lines.push('创业黄了：押注 ' + bet.stake + ' 只回来 ' + back + '，心态 -8');
      }
    } else if (bet.kind === 'stock') {
      var r = -0.4 + E._rng() * 1.0;
      var out = Math.round(bet.stake * (1 + r) / 100) * 100;
      s.cash += out;
      var d = out - bet.stake;
      s.mentality = I.clamp(s.mentality + (d >= 0 ? 3 : -4), 0, 100);
      lines.push('股票清仓：拿回 ' + out + '（' + (d >= 0 ? '盈' : '亏') + ' ' + Math.abs(d) + '）');
    } else if (bet.kind === 'creator') {
      var p = s.flags.followers ? 0.55 : 0.4;
      if (E._rng() < p) {
        s.cash += bet.stake;
        s.freeIncomeRate = Math.max(s.freeIncomeRate, 0.6);
        s.flags.followers = true;
        s.mentality = I.clamp(s.mentality + 8, 0, 100);
        lines.push('账号起来了：本金收回，每月多一份 ' + Math.round(s.setup.salary * 0.6) + ' 左右的流量收入，心态 +8');
      } else {
        var back2 = Math.round(bet.stake * 0.5 / 100) * 100;
        s.cash += back2;
        s.mentality = I.clamp(s.mentality - 6, 0, 100);
        lines.push('号没做起来：投入折半回来，心态 -6');
      }
    }
  }

  function acceptOffer(s) {
    if (!s.pendingOffer) return null;
    s.employed = true;
    s.newSalary = s.pendingOffer;
    s.pendingOffer = null;
    var key = s.newSalary >= Math.round(s.setup.salary * CFG.endings.betterSalary) ? 'better' : '_return';
    endGame(s, key);
    return { ended: s.ended, endKey: key, newSalary: s.newSalary };
  }

  function rejectOffer(s) {
    if (!s.pendingOffer) return null;
    s.stats.offersRejected++;
    I.addTags(s, { gambler: 1 });
    s.mentality = I.clamp(s.mentality - 4, 0, 100);
    s.pendingOffer = null;
    return { ended: false };
  }

  function endGame(s, key) {
    if (s.ended) return;
    s.ended = true;
    s.endingKey = key;
    s.endMonth = s.month;
    s.phase = 'end';
  }

  function personality(s) {
    var months = Math.max(1, s.planHistory.length);
    var scores = {
      gambler: (s.bigBets >= 2 ? CFG.personality.bonus.gamblerBigBets : 0) + s.bigBets * 2 + (s.tags.gambler || 0) + s.stats.offersRejected,
      pragmatist: s.gigCount * 2 + s.huntCount + (s.tags.pragmatist || 0),
      lyingFlat: s.restCount + (s.longestLyingStreak >= CFG.personality.lyingStreak ? CFG.personality.bonus.lyingStreak : 0) + (s.tags.lyingFlat || 0),
      grinder: s.learnCount * 2 + (s.learnCount / months >= CFG.personality.grinderRatio ? CFG.personality.bonus.grinderRatio : 0) + (s.tags.grinder || 0),
      minimalist: (s.tags.minimalist || 0),
      waverer: (s.strategySwitches >= CFG.personality.wavererMinSwitches ? CFG.personality.bonus.wavererSwitches : 0) + s.strategySwitches + (s.tags.waverer || 0)
    };
    var keys = Object.keys(scores).sort(function (a, b) { return scores[b] - scores[a]; });
    var composite = scores[keys[0]] - scores[keys[1]] < CFG.personality.compositeGap;
    return { primary: keys[0], secondary: composite ? keys[1] : null, scores: scores, composite: composite };
  }

  function regret(s) {
    var drawdown = s.initialCash > 0 ? (s.initialCash - s.stats.lowestCash) / s.initialCash : 0;
    var r = 30;
    if (s.stats.minMentality < 30) r += 20; else if (s.stats.minMentality < 50) r += 10;
    if (drawdown > 0.6) r += 15; else if (drawdown > 0.3) r += 8;
    r += Math.min(15, s.strategySwitches * 5);
    if (s.endingKey === 'crash') r += 10;
    if (s.endingKey === 'better') r -= 20;
    return I.clamp(r, 5, 95);
  }

  function finish(s) {
    if (!s.ended) endGame(s, 'fog');
    var ENDINGS = global.LC.ENDINGS;
    var key = s.endingKey === '_return' ? '_return' : s.endingKey;
    var def = ENDINGS[key];
    var p = personality(s);
    var PER = global.LC.PERSONALITIES;
    var pName = PER[p.primary].name + (p.secondary ? ' × ' + PER[p.secondary].name : '');
    var roast = PER[p.primary].roast;
    var stats = {
      months: s.endMonth,
      interviews: s.stats.interviews,
      cashDrawdown: Math.max(0, s.initialCash - s.stats.lowestCash),
      regret: regret(s)
    };
    return {
      endingKey: key,
      line: def.line,
      title: def.titles[s.endMonth % def.titles.length],
      text: def.text(s),
      personality: p,
      personalityName: pName,
      roast: roast,
      stats: stats,
      salaryChange: s.employed && s.newSalary ? Math.round((s.newSalary / s.setup.salary - 1) * 100) : null
    };
  }

  function toPlan(s) {
    if (s.ended) return false;
    if (s.eventChoiceTaken) { s.phase = 'plan'; return true; }
    return false;
  }

  E.startMonth = startMonth;
  E.choosePlan = choosePlan;
  E.toPlan = toPlan;
  E.acceptOffer = acceptOffer;
  E.rejectOffer = rejectOffer;
  E.personality = personality;
  E.regret = regret;
  E.finish = finish;
  E.PLANS = PLANS;
  E._endGame = endGame;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function (global) {
  'use strict';

  var CFG = global.LC.CONFIG;

  var CITY_NOUN = { tier1: '一线城市', newtier: '新一线', hometown: '老家县城' };
  var FAMILY_NOUN = { single: '一个人住', partner: '和伴侣一起', kid: '拉着一个娃' };
  var GENDER_NOUN = { female: '女生', male: '男生', secret: '人' };

  function makeOpening(setup) {
    var wan = function (n) { return (n / 10000) >= 1 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万' : n + ' 元'; };
    var openings = [
      setup.age + ' 岁，一个在' + CITY_NOUN[setup.city] + '打拼的' + GENDER_NOUN[setup.gender] +
        '，' + FAMILY_NOUN[setup.family] + '，月薪 ' + setup.salary + '。某天晚上加完班，你看着工牌上的自己，突然觉得够了。第二天，你裸辞了。存款 ' +
        wan(setup.savings) + '，是你全部的底气，也是你唯一的倒计时。',
      '你在' + CITY_NOUN[setup.city] + '做了几年，' + (setup.age >= 33 ? '卡在三十好几' : '刚过二十五六') +
        '，月薪 ' + setup.salary + '，' + FAMILY_NOUN[setup.family] + '。辞掉工作的那天下午，你走出写字楼，阳光刺得你眯起眼——上一次这个点出门，还是去医院。存款 ' + wan(setup.savings) + '，从今天起，每一分都有它的意义。',
      '「提离职那天，我请自己吃了顿好的。」——你，' + setup.age + ' 岁，月薪 ' + setup.salary + '，' +
        CITY_NOUN[setup.city] + '，存款 ' + wan(setup.savings) + '。' + FAMILY_NOUN[setup.family] +
        '的日子并不便宜，但那一刻你觉得，人生第一次这么贵得值得。这一年，从今天开始算。'
    ];
    return openings[setup.age % openings.length];
  }

  function makeQuote() {
    return global.LC.QUOTES[Math.floor(Math.random() * global.LC.QUOTES.length)];
  }

  function makeMontage(result, setup) {
    var from = result.stats.months + 1;
    var to = setup ? setup.months || 12 : 12;
    var lines = [];
    if (result.endingKey === 'better') {
      lines.push('第 ' + from + ' 个月起：入职体检、走流程、领电脑，一切熟悉又陌生。');
      lines.push('新同事问你怎么这么淡定，你笑笑：见过更难的局。');
    } else if (result.endingKey === '_return') {
      lines.push('工位还是那个工位，你把显示器垫高了两厘米——这次按你自己的意思。');
      lines.push('有人等你出洋相，你没给机会；这一年练出的心态，办公室里学不到。');
    } else if (result.endingKey === 'transform') {
      lines.push('第一个月流水惨淡，第二个月老客带新客。');
      lines.push('你把辞职信的截图，裱起来挂在了店里/工位上方。');
    } else if (result.endingKey === 'fog') {
      lines.push('有人问你打算千嘛，你第一次没有心虚。');
      lines.push('你开始收拾简历，也收拾心情——不是退回原路，是往前探路。');
    } else if (result.endingKey === 'crash') {
      lines.push('你退掉房子，寄回行李，只背一个包上路。');
      lines.push('这一局输了，但你知道了地图上哪里有坑。');
    }
    lines.push('到第 ' + to + ' 个月，这一年翻篇了。');
    return lines;
  }

  function llmChat(prompt, fallback) {
    if (!CFG.llm.enabled || !CFG.llm.url) return Promise.resolve(fallback());
    return new Promise(function (resolve) {
      var settled = false;
      var done = function (val) { if (!settled) { settled = true; resolve(val || fallback()); } };
      var timer = setTimeout(function () { done(null); }, CFG.llm.timeoutMs);
      fetch(CFG.llm.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CFG.llm.apiKey },
        body: JSON.stringify({
          model: CFG.llm.model,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.9
        })
      }).then(function (r) { return r.json(); })
        .then(function (j) {
          clearTimeout(timer);
          var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
          done(txt && txt.trim());
        })
        .catch(function () { clearTimeout(timer); done(null); });
    });
  }

  function opening(setup) {
    return llmChat(
      '用一两句话为以下人设写一个中文裸辞开场白，80字以内，语气克制、有画面感，不要鸡汤：' +
      JSON.stringify({ age: setup.age, salary: setup.salary, savings: setup.savings, city: CITY_NOUN[setup.city] }),
      function () { return makeOpening(setup); }
    );
  }

  function endingQuote(result) {
    return llmChat(
      '为一个人生模拟游戏写一句中文金句，30字以内，要锋利但不说教，主题：裸辞与选择。游戏结局信息：' +
      JSON.stringify({ line: result.line, personality: result.personalityName, regret: result.stats.regret }),
      function () { return makeQuote(); }
    );
  }

  global.LC = global.LC || {};
  global.LC.Narrative = {
    makeOpening: makeOpening,
    makeQuote: makeQuote,
    makeMontage: makeMontage,
    opening: opening,
    endingQuote: endingQuote
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function (global) {
  'use strict';

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    var chars = String(text).split('');
    var line = '', lines = [];
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = chars[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], x, y + j * lineHeight);
    return lines.length * lineHeight;
  }

  function render(canvas, result, setup) {
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    ctx.fillStyle = '#fdf7ef';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f2762e';
    ctx.fillRect(0, 0, W, 12);
    ctx.fillRect(0, H - 12, W, 12);

    ctx.fillStyle = '#a2937f';
    ctx.font = '600 32px "PingFang SC","Noto Sans SC",sans-serif';
    ctx.fillText('裸 辞 模 拟 器', 80, 104);

    ctx.fillStyle = '#d95f1f';
    ctx.font = '700 30px sans-serif';
    ctx.fillText('你的裸辞人格', 80, 192);

    ctx.fillStyle = '#2f2721';
    var nameSize = 70;
    ctx.font = '800 ' + nameSize + 'px "Noto Serif SC","Songti SC","PingFang SC",serif';
    var nameY = 290;
    var nameLines = wrapText(ctx, result.personalityName, 80, nameY, W - 160, nameSize + 16);

    ctx.fillStyle = '#a2937f';
    ctx.font = '400 28px sans-serif';
    var rarity = result.personality.composite ? '复合人格 · 比稀有更稀有' : '这一型，在人堆里一眼能认出来';
    var rarityY = nameY + nameLines + 46;
    ctx.fillText(rarity, 80, rarityY);

    ctx.strokeStyle = '#eadccb';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(80, rarityY + 44);
    ctx.lineTo(W - 80, rarityY + 44);
    ctx.stroke();

    ctx.fillStyle = '#6b5b4d';
    ctx.font = 'italic 400 34px "Noto Serif SC","Songti SC","PingFang SC",serif';
    var roastY = rarityY + 102;
    var roastLines = wrapText(ctx, '「' + result.roast + '」', 80, roastY, W - 175, 54);

    ctx.fillStyle = '#b4a58f';
    ctx.font = '600 25px sans-serif';
    ctx.fillText('—— 这一年 ——', 80, roastY + roastLines + 54);

    ctx.fillStyle = '#33281f';
    ctx.font = '700 40px sans-serif';
    var statY = roastY + roastLines + 116;
    ctx.fillText('扛了 ' + result.stats.months + ' 个月', 80, statY);
    ctx.fillText('面试 ' + result.stats.interviews + ' 次', 80, statY + 62);
    var dd = result.stats.cashDrawdown / 10000;
    var ddTxt = dd >= 1 ? dd.toFixed(1) + ' 万' : Math.round(result.stats.cashDrawdown) + ' 元';
    ctx.fillStyle = '#6b5b4d';
    ctx.fillText('存款最大回落 ' + ddTxt, 80, statY + 124);
    ctx.fillStyle = '#d95f1f';
    ctx.fillText('后悔指数 ' + result.stats.regret, 80, statY + 186);

    var endY = statY + 274;
    ctx.fillStyle = '#b4a58f';
    ctx.font = '600 25px sans-serif';
    ctx.fillText('—— 结局 · ' + result.line + ' ——', 80, endY);
    ctx.fillStyle = '#2f2721';
    ctx.font = '700 36px "Noto Serif SC","Songti SC","PingFang SC",serif';
    wrapText(ctx, result.title, 80, endY + 60, W - 160, 50);

    ctx.fillStyle = '#8f7f6b';
    ctx.font = 'italic 400 28px "Noto Serif SC","Songti SC",serif';
    var quoteY = Math.min(endY + 212, H - 368);
    wrapText(ctx, '"' + result.quote + '"', 80, quoteY, W - 175, 46);

    ctx.strokeStyle = '#e5d5c0';
    ctx.strokeRect(80, H - 216, 104, 104);
    ctx.fillStyle = '#c0b09a';
    ctx.font = '400 18px sans-serif';
    ctx.fillText('二维码', 106, H - 160);
    ctx.fillStyle = '#33281f';
    ctx.font = '600 24px sans-serif';
    ctx.fillText('我替你活了一遍辞职后的那一年', 208, H - 172);
    ctx.fillStyle = '#a2937f';
    ctx.fillText('你也来试试？', 208, H - 136);

    return canvas.toDataURL('image/png');
  }

  global.LC = global.LC || {};
  global.LC.Card = { render: render };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function (global) {
  'use strict';

  var doc = global.document;
  var $ = function (id) { return doc.getElementById(id); };
  var Engine = global.LC.Engine;
  var Narrative = global.LC.Narrative;

  var ui = {
    state: null,
    setup: null,
    result: null,
    introDone: false,
    quoteText: ''
  };

  var BOUNDS = {
    'in-age': [22, 40, 1],
    'in-salary': [3000, 80000, 1000],
    'in-savings': [1000, 500000, 5000]
  };

  function showScreen(id) {
    var screens = doc.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    $(id).classList.add('active');
    global.scrollTo(0, 0);
  }

  function segValue(segId) {
    var sel = doc.querySelector('#' + segId + ' .seg-btn.selected');
    return sel ? sel.dataset.value : null;
  }

  function setSeg(segId, value) {
    var btns = doc.querySelectorAll('#' + segId + ' .seg-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('selected', btns[i].dataset.value === value);
    }
  }

  function numVal(id) {
    var b = BOUNDS[id];
    var v = parseInt($(id).value, 10);
    if (isNaN(v)) v = b[0];
    return Math.max(b[0], Math.min(b[1], v));
  }

  function readSetup() {
    return {
      age: numVal('in-age'),
      salary: numVal('in-salary'),
      savings: numVal('in-savings'),
      gender: segValue('seg-gender') || 'secret',
      housing: segValue('seg-housing'),
      family: segValue('seg-family'),
      city: segValue('seg-city')
    };
  }

  function writeSetup(s) {
    $('in-age').value = s.age;
    $('in-salary').value = s.salary;
    $('in-savings').value = s.savings;
    setSeg('seg-gender', s.gender);
    setSeg('seg-housing', s.housing);
    setSeg('seg-family', s.family);
    setSeg('seg-city', s.city);
    previewBurn();
  }

  function fmtWan(n) {
    var v = Math.abs(n) / 10000;
    return (v >= 1 ? (v >= 10 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, '')) + ' 万' : Math.round(Math.abs(n)) + ' 元');
  }

  function previewBurn() {
    var s = readSetup();
    var tmp = { setup: s, burnMods: [], frugalMonths: 0 };
    var burn = Engine.burnRate(tmp);
    var months = burn > 0 ? Math.floor(s.savings / burn) : 99;
    $('savings-hint').textContent = '约 ' + months + ' 个月刚性支出';
    $('burn-preview').innerHTML =
      '每月固定支出约 <b>' + burn.toLocaleString() + ' 元</b>，你的存款能撑 <b>' +
      Math.min(months, 99) + ' 个月</b>（一分钱进项都没有的前提下）。';
  }

  function clampInput(id) {
    var b = BOUNDS[id];
    var v = parseInt($(id).value, 10);
    if (isNaN(v)) v = b[0];
    v = Math.max(b[0], Math.min(b[1], v));
    var step = b[2];
    v = Math.round(v / step) * step;
    $(id).value = v;
    return v;
  }

  function bindNumberInputs() {
    Object.keys(BOUNDS).forEach(function (id) {
      $(id).addEventListener('input', previewBurn);
      $(id).addEventListener('change', function () { clampInput(id); previewBurn(); });
      $(id).addEventListener('blur', function () { clampInput(id); previewBurn(); });
    });

    var steps = doc.querySelectorAll('.step-btn');
    for (var i = 0; i < steps.length; i++) {
      steps[i].addEventListener('click', function () {
        var id = this.dataset.step;
        var dir = parseInt(this.dataset.dir, 10);
        var b = BOUNDS[id];
        var v = clampInput(id) + dir * b[2];
        v = Math.max(b[0], Math.min(b[1], v));
        $(id).value = v;
        previewBurn();
      });
    }
  }

  function bindSegments() {
    ['seg-gender', 'seg-housing', 'seg-family', 'seg-city'].forEach(function (segId) {
      var btns = doc.querySelectorAll('#' + segId + ' .seg-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          setSeg(segId, this.dataset.value);
          previewBurn();
        });
      }
    });
  }

  function randomSetup() {
    var r = function (min, max, step) { return min + Math.round(Math.random() * (max - min) / step) * step; };
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    writeSetup({
      age: r(22, 40, 1),
      salary: r(5, 45, 1) * 1000,
      savings: r(1, 40, 1) * 10000,
      gender: pick(['female', 'male', 'female', 'male', 'secret']),
      housing: pick(['none', 'rent', 'rent', 'mortgage']),
      family: pick(['single', 'single', 'partner', 'kid']),
      city: pick(['tier1', 'newtier', 'hometown'])
    });
  }

  function bindSetup() {
    bindNumberInputs();
    bindSegments();
    $('btn-random').addEventListener('click', randomSetup);
    $('btn-reroll-inherit').addEventListener('click', randomSetup);
    $('btn-start').addEventListener('click', startGame);
    previewBurn();
  }

  function parseShareParams() {
    var q = {};
    global.location.search.replace(/([a-z]+)=([^&]+)/g, function (_, k, v) { q[k] = decodeURIComponent(v); });
    if (!q.age && !q.salary) return;
    var num = function (v, min, max, dft) {
      var n = parseInt(v, 10);
      if (isNaN(n)) return dft;
      return Math.max(min, Math.min(max, n));
    };
    var oneOf = function (v, list, dft) { return list.indexOf(v) >= 0 ? v : dft; };
    writeSetup({
      age: num(q.age, 22, 40, 28),
      salary: num(q.salary, 3000, 80000, 15000),
      savings: num(q.savings, 1000, 500000, 80000),
      gender: oneOf(q.gender, ['female', 'male', 'secret'], 'secret'),
      housing: oneOf(q.housing, ['none', 'rent', 'mortgage'], 'rent'),
      family: oneOf(q.family, ['single', 'partner', 'kid'], 'single'),
      city: oneOf(q.city, ['tier1', 'newtier', 'hometown'], 'tier1')
    });
    $('share-banner').classList.remove('hidden');
    $('share-banner-text').textContent = '朋友把他的人设扔给了你：同一起点，不同人生。';
  }

  function startGame() {
    var setup = readSetup();
    ui.setup = setup;
    ui.state = Engine.create(setup);
    ui.introDone = false;
    showScreen('screen-game');
    showIntro();
  }

  function renderStatus() {
    var s = ui.state;
    $('month-tag').textContent = s.month === 0 ? '开局' : '第 ' + s.month + ' / ' + s.MONTHS + ' 个月';
    var tag = $('cash-tag');
    tag.textContent = '存款 ' + fmtWan(s.cash);
    tag.classList.toggle('danger', s.cash < 0);
    $('out-mentality').textContent = s.mentality;
    var mb = $('bar-mentality');
    mb.style.width = s.mentality + '%';
    mb.className = 'bar-fill mentality ' + (s.mentality < 30 ? 'danger' : s.mentality < 50 ? 'warn' : '');
    $('out-comp').textContent = s.comp;
    $('bar-comp').style.width = s.comp + '%';
    renderDots('progress-dots', s.month - 1);
  }

  function renderDots(containerId, doneCount) {
    var box = $(containerId);
    if (!box) return;
    box.innerHTML = '';
    for (var i = 0; i < ui.state.MONTHS; i++) {
      var d = doc.createElement('div');
      d.className = 'pdot' + (i < doneCount ? ' done' : '');
      box.appendChild(d);
    }
  }

  function showIntro() {
    renderStatus();
    $('event-cat').className = 'event-cat';
    $('event-cat').textContent = '开场';
    $('event-title').textContent = '';
    $('event-text').textContent = Narrative.makeOpening(ui.setup);
    $('choice-area').innerHTML = '';
    var btn = mkBtn('开始这一年 →', 'btn primary wide');
    btn.addEventListener('click', function () {
      ui.introDone = true;
      beginMonth();
    });
    $('choice-area').appendChild(btn);
  }

  function beginMonth() {
    var s = ui.state;
    var ev = Engine.startMonth(s);
    renderStatus();
    var catEl = $('event-cat');
    if (ev) {
      catEl.className = 'event-cat cat-' + ev.cat;
      catEl.textContent = catName(ev.cat);
      $('event-title').textContent = ev.title;
      $('event-text').textContent = ev.text;
      if (ev.choice) renderEventChoices(ev);
      else renderPlanChoices();
    } else {
      catEl.className = 'event-cat';
      catEl.textContent = '平常的一天';
      $('event-title').textContent = '这个月没什么大事';
      $('event-text').textContent = '日子像温水，不烫也不凉。时间往前走，你得决定怎么用。';
      renderPlanChoices();
    }
  }

  function catName(cat) {
    return { job: '求职', gig: '搞钱', boom: '风口', family: '家庭', accident: '意外', social: '社交' }[cat] || '生活';
  }

  function mkBtn(label, cls) {
    var b = doc.createElement('button');
    b.className = cls || 'btn soft wide';
    b.textContent = label;
    return b;
  }

  function renderEventChoices(ev) {
    var area = $('choice-area');
    area.innerHTML = '';
    ev.choice.options.forEach(function (opt, i) {
      var wrap = doc.createElement('div');
      wrap.className = 'choice';
      var b = mkBtn(opt.label, 'btn soft wide');
      b.style.textAlign = 'left';
      wrap.appendChild(b);
      if (opt.note) {
        var note = doc.createElement('div');
        note.className = 'choice-note';
        note.textContent = opt.note;
        wrap.appendChild(note);
      }
      b.addEventListener('click', function () {
        var r = Engine.resolveEvent(ui.state, i);
        if (r && r.ended) { showEnd(); return; }
        renderPlanChoices();
      });
      area.appendChild(wrap);
    });
  }

  function renderPlanChoices() {
    var s = ui.state;
    if (!Engine.toPlan(s)) return;
    var area = $('choice-area');
    area.innerHTML = '';
    var head = doc.createElement('div');
    head.className = 'plan-head';
    head.textContent = '· 这个月，你主要干什么 ·';
    area.appendChild(head);
    Object.keys(Engine.PLANS).forEach(function (pid) {
      var p = Engine.PLANS[pid];
      var wrap = doc.createElement('div');
      wrap.className = 'choice';
      var b = mkBtn(p.label, 'btn soft wide');
      b.style.textAlign = 'left';
      var note = doc.createElement('div');
      note.className = 'choice-note';
      note.textContent = p.desc;
      wrap.appendChild(b); wrap.appendChild(note);
      b.addEventListener('click', function () { doPlan(pid); });
      area.appendChild(wrap);
    });
  }

  function doPlan(pid) {
    var report = Engine.choosePlan(ui.state, pid);
    showReport(report);
  }

  function showReport(report) {
    showScreen('screen-report');
    $('report-month-tag').textContent = '第 ' + report.month + ' / ' + ui.state.MONTHS + ' 个月 · 月报';
    renderDots('report-progress-dots', report.month);
    $('report-title').textContent = '「' + (Engine.PLANS[report.plan] ? Engine.PLANS[report.plan].label : '突发事件') + '」的一个月';
    var lines = $('report-lines');
    lines.innerHTML = '';
    report.lines.forEach(function (t) {
      var d = doc.createElement('div');
      d.className = 'report-line';
      d.textContent = t;
      lines.appendChild(d);
    });
    var s = ui.state;
    $('report-status').innerHTML =
      '存款 <b>' + fmtWan(s.cash) + '</b> ・ 心态 <b>' + s.mentality + '</b> ・ 竞争力 <b>' + s.comp + '</b>' +
      (s.pendingBet ? '<br>一笔押注在桌上（' + fmtWan(s.pendingBet.stake) + '），下个月开奖' : '');

    var nextArea = $('btn-next-month');
    nextArea.style.display = report.offer ? 'none' : '';
    nextArea.textContent = report.ended ? '看看这一年 →' : '下个月 →';

    if (report.offer) {
      var q = doc.createElement('div');
      q.className = 'offer-box';
      q.textContent = 'offer：' + report.offer.toLocaleString() + ' 元/月（原工资的 ' + Math.round(report.offer / ui.setup.salary * 100) + '%）';
      lines.appendChild(q);
      var row = doc.createElement('div');
      row.className = 'offer-actions';
      var acc = mkBtn('接了，先上岸', 'btn primary');
      var rej = mkBtn('拒绝，再等等', 'btn soft');
      acc.addEventListener('click', function () {
        Engine.acceptOffer(ui.state);
        showEnd();
      });
      rej.addEventListener('click', function () {
        Engine.rejectOffer(ui.state);
        nextArea.style.display = '';
        q.remove(); row.remove();
        alertMsg('拒了。心态 -4，你赌后面有更好的。');
      });
      row.appendChild(acc); row.appendChild(rej);
      lines.appendChild(row);
    }
  }

  function alertMsg(t) {
    var d = doc.createElement('div');
    d.className = 'toast';
    d.textContent = t;
    doc.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2400);
  }

  $('btn-next-month').addEventListener('click', function () {
    if (ui.state.ended) { showEnd(); return; }
    showScreen('screen-game');
    beginMonth();
  });

  function showEnd() {
    var s = ui.state;
    var result = Engine.finish(s);
    ui.result = result;
    showScreen('screen-end');
    $('end-line').textContent = '结局 · ' + result.line;
    $('end-title').textContent = result.title;
    $('end-text').textContent = result.text;

    var mg = $('montage');
    mg.innerHTML = '';
    if (result.stats.months < s.MONTHS) {
      Narrative.makeMontage(result, { months: s.MONTHS }).forEach(function (t) {
        var d = doc.createElement('div');
        d.className = 'montage-line';
        d.textContent = t;
        mg.appendChild(d);
      });
    }

    $('p-name').textContent = result.personalityName;
    $('p-roast').textContent = '「' + result.roast + '」';
    $('p-rarity').textContent = result.personality.composite ? '复合人格 · 比稀有更稀有' : '在裸辞人群里，你是很有辨识度的一型';

    var salary = result.salaryChange === null ? '没有新工资' :
      (result.salaryChange >= 0 ? '新工资 +' : '新工资 ') + result.salaryChange + '%';
    $('end-stats').innerHTML =
      '扛了 <b>' + result.stats.months + '</b> 个月 ・ 面试 <b>' + result.stats.interviews +
      '</b> 次<br>存款最大回落 <b>' + fmtWan(result.stats.cashDrawdown) + '</b> ・ 后悔指数 <b>' +
      result.stats.regret + '</b><br>' + salary;

    $('end-quote').textContent = '“' + (ui.quoteText || '后悔是裸辞的售后服务，每人一份，无法退货。') + '”';
    Narrative.endingQuote(result).then(function (q) {
      ui.quoteText = q;
      $('end-quote').textContent = '“' + q + '”';
    });

    $('card-area').classList.add('hidden');
  }

  $('btn-card').addEventListener('click', function () {
    var result = ui.result;
    result.quote = ui.quoteText || '后悔是裸辞的售后服务，每人一份，无法退货。';
    var canvas = $('card-canvas');
    var dataUrl = global.LC.Card.render(canvas, result, ui.setup);
    $('card-download').href = dataUrl;
    $('card-area').classList.remove('hidden');
    $('card-area').scrollIntoView({ behavior: 'smooth' });
  });

  $('btn-replay').addEventListener('click', function () {
    showScreen('screen-setup');
  });

  $('btn-share-link').addEventListener('click', function () {
    var s = ui.setup;
    var base = global.location.href.split('?')[0].split('#')[0];
    var url = base + '?age=' + s.age + '&salary=' + s.salary + '&savings=' + s.savings +
      '&gender=' + s.gender + '&housing=' + s.housing + '&family=' + s.family + '&city=' + s.city;
    var fallback = function () {
      var ta = doc.createElement('textarea');
      ta.value = url; doc.body.appendChild(ta); ta.select();
      doc.execCommand('copy'); ta.remove();
      alertMsg('链接已复制。同一起点，看谁活得漂亮。');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        alertMsg('链接已复制。同一起点，看谁活得漂亮。');
      }, fallback);
    } else fallback();
  });

  global.LC.UI = ui;
  bindSetup();
  parseShareParams();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script type="text/javascript" src="/accessproxy_statics/h5_fp.js" defer></script>
<script type="text/javascript" src="/accessproxy_statics/wm.js" defer></script>
</body>
</html>
